     page's paper-map scene (WelcomeScene.tsx, as it renders, frozen mid-bob) with the title and the
     tagline. Rendered at 1200 x 630, see ARCHITECTURE.md (Link previews). The title is Nunito Black
     (SIL Open Font License, from Google Fonts while rendering), close to the page's SF Pro Rounded,
     which may not be baked into an image. -->

      html,

        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 0 60px;
        box-sizing: border-box;
        background: #efeff4;
        font-family: Nunito, sans-serif;
        color: #293133;
      }
      .title {
        margin: 0;
        font-size: 84px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.01em;
        color: #2f8f5b;
        -webkit-text-stroke: 10px #f6f6f6;
        paint-order: stroke fill;
        text-shadow: 4px 6px 0 rgb(41 49 51 / 0.28);
      }
      .tagline {
        margin: 22px 0 0;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.25;
      }
      .about {
        margin: 18px 0 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        opacity: 0.6;
      }
      .scene {
        --scene-map: #eadebd;
        --scene-ink: #293133;
        --scene-road: #f6f6f6;
        --scene-river: #2271b3;
        --scene-park: #57a639;
        --scene-trail: #293133;
        --scene-shadow: rgb(41 49 51 / 0.22);
        flex: none;
        display: block;
        overflow: visible;
      }
      .scene-map {
        fill: var(--scene-map);
      }
      .scene-map-edge {
        fill: none;
        stroke: var(--scene-ink);
        stroke-width: 3;
        stroke-linejoin: round;
      }
      .scene-map-shadow,
      .scene-ground-shadow {
        fill: var(--scene-shadow);
      }
      .scene-map-fold {
        fill: rgb(0 0 0 / 0.07);
      }
      .scene-park {
        fill: var(--scene-park);
        stroke: var(--scene-ink);
        stroke-width: 2.5;
      }
      .scene-river {
        fill: none;
        stroke: var(--scene-river);
        stroke-width: 22;
        stroke-linecap: round;
      }
      .scene-river-shine {
        fill: none;
        stroke: rgb(255 255 255 / 0.45);
        stroke-width: 2.5;
        stroke-dasharray: 10 18;
        stroke-linecap: round;
      }
      .scene-road-edge,
      .scene-road {
        fill: none;
        stroke-linecap: round;
      }
      .scene-road-edge {
        stroke: var(--scene-ink);
        stroke-width: 13;
      }
      .scene-road {
        stroke: var(--scene-road);
        stroke-width: 8;
      }
      .scene-trail {
        fill: none;
        stroke: var(--scene-trail);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-dasharray: 0.1 9;
      }
      .scene-bob {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        transform: translateY(-2px) rotate(-3deg);
      }
      .scene-bob.scene-delay-1 {
        transform: translateY(-4px) rotate(2deg);
      }
      .scene-bob.scene-delay-2 {
        transform: translateY(-1px) rotate(3deg);
      }
      .scene-cloud.scene-delay-1 {
        transform: translateX(10px);
      }
    </style>
