<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Panopticon's icon: a folded paper map with a red paper-cutout pin, in the front page's style
       (RAL colours). public/icon-*.png and apple-touch-icon.png are the same drawing without the
       rounded corners (iOS and Android round them), rendered at 1024 px and scaled down. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa56c"/>
      <stop offset="1" stop-color="#2a8051"/>
    </linearGradient>
    <clipPath id="map"><polygon points="214,330 802,292 822,724 196,762"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>
  <!-- The map: a folded sheet of paper, with its hard shadow. -->
  <polygon points="214,330 802,292 822,724 196,762" transform="translate(18 26)" fill="#293133" fill-opacity="0.32"/>
  <polygon points="214,330 802,292 822,724 196,762" fill="#EADEBD"/>
  <g clip-path="url(#map)">
    <polygon points="410,318 606,304 620,738 404,750" fill="#000" fill-opacity="0.07"/>
    <path d="M232 364 q90 -40 160 -6 q40 26 6 88 q-46 52 -128 30 q-64 -24 -38 -112z" fill="#57A639" stroke="#293133" stroke-width="12"/>
    <path d="M180 650 C 330 590, 420 720, 560 660 S 760 560, 860 600" fill="none" stroke="#2271B3" stroke-width="58" stroke-linecap="round"/>
    <path d="M180 650 C 330 590, 420 720, 560 660 S 760 560, 860 600" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="8" stroke-dasharray="26 40" stroke-linecap="round"/>
    <path d="M180 520 C 400 500, 600 540, 860 470" fill="none" stroke="#293133" stroke-width="40" stroke-linecap="round"/>
    <path d="M180 520 C 400 500, 600 540, 860 470" fill="none" stroke="#F6F6F6" stroke-width="24" stroke-linecap="round"/>
    <path d="M300 470 C 360 430, 440 470, 500 560" fill="none" stroke="#293133" stroke-width="12" stroke-linecap="round" stroke-dasharray="0.1 30"/>
  </g>
  <polygon points="214,330 802,292 822,724 196,762" fill="none" stroke="#293133" stroke-width="14" stroke-linejoin="round"/>
  <!-- The pin: a red paper cutout with a white edge and a hard shadow, its point on the trail. -->
  <g transform="translate(560 600) rotate(6)">
    <ellipse cx="0" cy="8" rx="58" ry="16" fill="#293133" fill-opacity="0.3"/>
    <path id="pin" d="M0 0 C -40 -70, -110 -130, -110 -210 a110 110 0 0 1 220 0 C 110 -130, 40 -70, 0 0z"/>
    <use href="#pin" transform="translate(16 20)" fill="#293133" fill-opacity="0.35" stroke="#293133" stroke-opacity="0.35" stroke-width="44" stroke-linejoin="round"/>
    <use href="#pin" fill="#F6F6F6" stroke="#F6F6F6" stroke-width="44" stroke-linejoin="round"/>
    <use href="#pin" fill="#CC0605" stroke="#293133" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="0" cy="-210" r="48" fill="#F6F6F6" stroke="#293133" stroke-width="12"/>
  </g>
</svg>
